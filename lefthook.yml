# Lefthook hook config, mirroring the bit-* plugin family so contributors get
# the same fast PHP + JS gating regardless of which BitApps plugin they're on.
# JS tooling config (package.json, vite/vitest/eslint/tsconfig) lives at the
# plugin root; the web app source stays under `frontend/`. The js-* commands run
# from the repo root (where package.json now is) and only fire when files under
# `frontend/` change.
pre-commit:
  parallel: true
  commands:
    php-lint:
      glob: '*.php'
      run: composer lint

    php-test:
      glob: '*php'
      run: composer test

    js-lint:
      glob: 'frontend/**/*.{js,ts,jsx,tsx}'
      run: pnpm lint

    js-typecheck:
      glob: 'frontend/**/*.{ts,tsx}'
      run: pnpm typecheck

    js-test:
      glob: 'frontend/**/*.test.{ts,tsx}'
      run: pnpm test

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
